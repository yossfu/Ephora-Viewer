name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Environment inventory (NDK, CMake, SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- ndk ---"; ls -1 "$ANDROID_HOME/ndk" 2>&1 || true
          echo "--- cmake ---"; ls -1 "$ANDROID_HOME/cmake" 2>&1 || true
          echo "--- platform-tools ---"; ls -1 "$ANDROID_HOME/platforms" 2>&1 || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "::error title=NDK ausente::No se encontro $ANDROID_HOME/ndk/26.1.10909125"
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            echo "::error title=CMake ausente::No se encontro $ANDROID_HOME/cmake/3.22.1"
            exit 1
          fi

      - name: Native self-test (slcore geometry)
        run: |
          c++ -std=c++17 -O1 -Wall -Wextra -fno-exceptions -fno-rtti \
            -Iapp/src/main/cpp \
            app/src/main/cpp/sl_prim_geometry.cpp app/src/main/cpp/slcore_tests.cpp \
            -o /tmp/slcore_tests
          /tmp/slcore_tests

      - name: Configure Gradle project (valida los scripts de build)
        run: gradle :app:tasks --no-daemon --console=plain

      - name: Build (nativo -> debug -> release)
        run: |
          set +e

          # Gradle is run once per phase so a failure is reported against the
          # phase that caused it (native / debug APK / release APK) instead of
          # being buried in one long log. Each phase's error is surfaced as a
          # GitHub annotation, which is what the "Annotations" panel shows.
          run_phase() {
            label="$1"; log="$2"; shift 2
            echo "===== $label: gradle $* ====="
            gradle "$@" --no-daemon --console=plain --stacktrace > "$log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              reason=$(grep -m1 -A 6 -E "^Execution failed for task|^A problem occurred|^Could not resolve|^> Task .* FAILED" "$log" | tr '\n' ' ' | tr -s ' ' | sed 's/%/%25/g' | cut -c1-900)
              concrete=$(grep -m1 -E "^e: file|: error:|CMake Error|C/C\+\+:|error: " "$log" | tr -s ' ' | sed 's/%/%25/g' | cut -c1-500)
              [ -z "$reason" ] && reason=$(tail -n 12 "$log" | tr '\n' ' ' | tr -s ' ' | sed 's/%/%25/g' | cut -c1-900)
              echo "::error title=$label FALLO::$reason"
              if [ -n "$concrete" ]; then
                echo "::error title=Error concreto ($label)::$concrete"
              fi
              {
                echo "### $label fallo"
                echo '```'
                grep -n -E "^e: |error:|CMake Error|> Task .* FAILED|Execution failed for task|What went wrong|Caused by|not found|Unresolved" "$log" | head -n 50
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "----- ultimas 120 lineas del log ($label) -----"
              tail -n 120 "$log"
            fi
            return $status
          }

          run_phase "Nativo (NDK/CMake)" gradle-native.log :app:externalNativeBuildDebug || exit $?
          run_phase "assembleDebug" gradle-debug.log assembleDebug || exit $?
          run_phase "assembleRelease" gradle-release.log assembleRelease || exit $?

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ephora-viewer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ephora-viewer-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
